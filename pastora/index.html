    const rows = [['Cosas censuradas', full(G.censored)], ['Nivel alcanzado', G.maxLevel + ' de ' + CFG.levels.length], ['Duración', mmss(G.time)]];
    rows.forEach((r, i) => { T(r[0], 24, 488 + i * 22, { size: 14, color: COL.muted, weight: 600 }); T(r[1], 336, 488 + i * 22, { size: 14, align: 'right', color: '#fff' }); });
    rr(24, H - 62, 312, 34, 8, COL.pink);
    T('¿ME SUPERAS?', 180, H - 51, { size: 11, font: F1, align: 'center', color: '#fff' });
    T('Desarrollado por MNRY · mantarraya.pe', 180, H - 20, { size: 9, align: 'center', color: COL.muted, weight: 400 });
  });
  return c;
}
const shareEl = document.getElementById('share');
let cardBlob = null;
function openShare() {
  track('compartir');
  const c = buildCard();
  document.getElementById('shImg').src = c.toDataURL('image/png');
  cardBlob = null; try { c.toBlob(b => { cardBlob = b; }, 'image/png'); } catch (e) {}
  const txt = shareText();
  document.getElementById('shTxt').value = txt;
  document.getElementById('shWa').href = 'https://wa.me/?text=' + encodeURIComponent(txt);
  document.getElementById('shNat').hidden = !navigator.share;
  shareEl.hidden = false;
}
document.getElementById('supSave').onclick = saveQR;
document.getElementById('supQr').onclick = saveQR;
document.getElementById('supQr').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); saveQR(); } };
document.getElementById('supCl').onclick = () => { document.getElementById('support').hidden = true; };
document.getElementById('shCl').onclick = () => { shareEl.hidden = true; };
document.getElementById('shCp').onclick = async () => {
  const ta = document.getElementById('shTxt'), b = document.getElementById('shCp');
  try { await navigator.clipboard.writeText(ta.value); b.textContent = 'Copiado'; } catch (e) { ta.focus(); ta.select(); b.textContent = 'Selecciónalo y copia'; }
  setTimeout(() => { b.textContent = 'Copiar texto'; }, 1800);
};
document.getElementById('shNat').onclick = async () => {
  const txt = document.getElementById('shTxt').value;
  try {
    const file = cardBlob ? new File([cardBlob], 'pastora-invaders.png', { type: 'image/png' }) : null;
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], text: txt });
    else await navigator.share({ text: txt });
  } catch (e) {}
};

/* ---------- entrada ---------- */
const ptrs = new Map();
function pt(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
function ctrlAt(p) { for (const k of ['left', 'right', 'fire']) if (inR(p.x, p.y, CB[k])) return k; return null; }
function syncTouch() { touch.left = touch.right = touch.fire = false; for (const v of ptrs.values()) if (v.ctrl) touch[v.ctrl] = true; }
cv.addEventListener('pointerdown', e => {
  if (scene === 'over' && G) G.overTouched = true;
  e.preventDefault(); unlockAudio(); cv.focus({ preventScroll: true });
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  const p = pt(e);
  for (let i = ui.length - 1; i >= 0; i--) if (inR(p.x, p.y, ui[i].r)) { pressedUI = ui[i]; ptrs.set(e.pointerId, { ui: ui[i] }); return; }
  if (scene === 'title' && sceneT < INTRO) { sceneT = INTRO; return; }
  if (scene === 'finale' && sceneT > 3) { endGame('win'); return; }
  if (scene === 'play') { const c = ctrlAt(p); if (c) { ptrs.set(e.pointerId, { ctrl: c }); syncTouch(); return; }
    // arrastrar en el escenario también mueve y dispara
    if (p.y > HUD && p.y < CTRL) { ptrs.set(e.pointerId, { drag: true, x: p.x }); dragTo(p.x); touch.fire = true; } }
}, { passive: false });
let dragX = null;
function dragTo(x) { dragX = x; }
cv.addEventListener('pointermove', e => {
  const s = ptrs.get(e.pointerId); if (!s) return; const p = pt(e);
  if (s.ctrl) { s.ctrl = ctrlAt(p) || s.ctrl; syncTouch(); }
  if (s.drag) { dragTo(p.x); touch.fire = true; }
});
function endPointer(e) {
  const s = ptrs.get(e.pointerId); ptrs.delete(e.pointerId);
  if (s && s.ui) { const p = pt(e); if (pressedUI && inR(p.x, p.y, pressedUI.r)) { const f = pressedUI.fn; pressedUI = null; SFX.click(); f(); } pressedUI = null; }
  if (s && s.drag) dragX = null;
  syncTouch(); if ([...ptrs.values()].some(v => v.drag)) touch.fire = true;
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (scene === 'over' && G) G.overTouched = true;
  const k = e.key === ' ' ? ' ' : e.key; keys[k] = true;
  if ([' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
  unlockAudio();
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { if (scene === 'play') pauseGame(); else if (scene === 'pause') resumeGame(); else if (!shareEl.hidden) shareEl.hidden = true; else document.getElementById('support').hidden = true; }
  if ((e.key === ' ' || e.key === 'Enter') && !e.repeat && shareEl.hidden && document.getElementById('support').hidden) {
    if (scene === 'title') { if (sceneT < INTRO) sceneT = INTRO; else newGame(); }
    else if (scene === 'pause') resumeGame();
    else if (scene === 'finale' && sceneT > 3) endGame('win');
    else if (scene === 'over' && G.overT > 1.4 && e.key === 'Enter') newGame();
  }
});
window.addEventListener('keyup', e => { keys[e.key === ' ' ? ' ' : e.key] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; ptrs.clear(); syncTouch(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
// arrastre: la pastora sigue el dedo
function applyDrag(dt) {
  if (scene !== 'play' || dragX === null || !G || G.hurtT > 0 || G.phase === 'dead') return;
  const dx = dragX - G.px; if (Math.abs(dx) > 3) { G.px += Math.sign(dx) * Math.min(Math.abs(dx), CFG.playerSpeed * 1.2 * dt); G.pdir = Math.sign(dx); G.moving = true; G.walkT += dt; }
}

/* ---------- bucle ---------- */
function resize() {
  const wrapEl = document.getElementById('wrap'), cs = getComputedStyle(wrapEl);
  const aw = wrapEl.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = wrapEl.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const s = Math.max(.3, Math.min(aw / W, ah / H));
  cv.style.width = Math.floor(W * s) + 'px'; cv.style.height = Math.floor(H * s) + 'px';
  K = Math.max(1, Math.min(3, Math.ceil(s * (window.devicePixelRatio || 1))));
  cv.width = W * K; cv.height = H * K;
}
window.addEventListener('resize', resize);
const creditEl = document.getElementById('credit');
function placeCredit() {
  const show = creditRect && (scene === 'title' || scene === 'pause' || (scene === 'over' && G && G.overT > 1.4)) && shareEl.hidden && document.getElementById('support').hidden;
  if (!show) { if (!creditEl.hidden) creditEl.hidden = true; creditRect = null; return; }
  const r = cv.getBoundingClientRect(), k = r.width / W;
  Object.assign(creditEl.style, { left: r.left + creditRect[0] * k + 'px', top: r.top + creditRect[1] * k + 'px', width: creditRect[2] * k + 'px', height: creditRect[3] * k + 'px' });
  creditEl.hidden = false; creditRect = null;
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (scene === 'loading' && loaded >= ASSETS.length) setScene('title');
  if (scene === 'play') applyDrag(dt);
  update(dt);
  ctx.setTransform(K, 0, 0, K, 0, 0); ctx.imageSmoothingEnabled = false;
  if (scene === 'title' || scene === 'loading') drawTitle();
  else if (scene === 'play') drawPlay();
  else if (scene === 'pause') drawPause();
  else if (scene === 'finale') drawFinale();
  else if (scene === 'over') drawOver();
  placeCredit();
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
// gancho para pruebas
window.__pinv = { get G() { return G; }, get scene() { return scene; }, newGame, startLevel, startFinale, endGame, set sceneT(v) { sceneT = v; } };
</script>
