  if (!show) { if (!creditEl.hidden) creditEl.hidden = true; creditRect = null; return; }
  const r = cv.getBoundingClientRect(), k = r.width / W;
  Object.assign(creditEl.style, { left: r.left + creditRect[0] * k + 'px', top: r.top + creditRect[1] * k + 'px', width: creditRect[2] * k + 'px', height: creditRect[3] * k + 'px' });
  creditEl.hidden = false; creditRect = null;
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (scene === 'loading' && loaded >= ASSETS.length) { setScene('title'); if (window.__jump) { const n = clamp(+window.__jump - 1, 0, 4); window.__jump = null; if (location.hash.includes('final')) { setScene('final'); } else openHowto(n); } }
  if (scene !== 'pause') update(dt); else sceneT += 0;
  ctx.setTransform(K, 0, 0, K, 0, 0); ctx.imageSmoothingEnabled = false;
  if (scene === 'title' || scene === 'loading') drawTitle();
  else if (scene === 'play') { if (CUR === 0) drawPlay(); else { ui = []; LV.draw(); } }
  else if (scene === 'pause') drawPause();
  else if (scene === 'over') drawOver();
  else if (scene === 'select') drawSelect();
  else if (scene === 'howto') drawHowto();
  else if (scene === 'final') drawFinal();
  placeCredit();
  requestAnimationFrame(frame);
}
resize(); requestAnimationFrame(frame);
window.__jump = (location.hash.match(/nivel(\d)/) || [])[1];
// gancho para pruebas
window.__kb = { get G() { return G; }, get scene() { return scene; }, get LV() { return LV; }, get CUR() { return CUR; }, get RES() { return RES; }, LEVELS, startLevel, openHowto, setScene, levelOver, newGame, fire, usePower, launchVel, CFG, SLING, BUKE, bukeBoxes, endGame };
