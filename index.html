<script>
'use strict';
/* =========================================================================
   KEIKO TAP TAP — ¡No me interrumpan, estoy en LIVE!
   Sátira política. Obra ficticia. Arte de personajes: MNRY.
   ========================================================================= */
const CFG = JSON.parse(document.getElementById('cfg').textContent);
const W = 360, H = 640, ST = 96, SB = 448;           // pantalla lógica y límites del escenario
const F1 = '"Press Start 2P", ui-monospace, monospace';
const F2 = '"Pixelify Sans", system-ui, sans-serif';
const COL = {
  ink:'#0b0f1a', panel:'#1b2134', panel2:'#252c45', line:'#3a4466', fg:'#f4f1ff', muted:'#9aa3c7',
  pink:'#ff3d7f', pink2:'#b81f55', red:'#e8283f', red2:'#8e1426', green:'#22c55e', green2:'#15803d',
  blue:'#3b5bdb', blue2:'#253c99', gold:'#ffc83d', gold2:'#b8860b', orange:'#fb923c', yellow:'#facc15',
  white:'#ffffff', sky:'#5aa9e6', cyan:'#38bdf8'
};
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
let K = 1;

/* ---------- utilidades ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const inR = (x, y, r) => x >= r[0] && x <= r[0] + r[2] && y >= r[1] && y <= r[1] + r[3];
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
function fmt(n) {
  n = Math.floor(n);
  if (n < 1000) return String(n);
  if (n < 1e6) return (n / 1000).toFixed(n < 1e4 ? 1 : 0).replace(/\.0$/, '') + 'K';
  return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
}
const full = n => Math.floor(n).toLocaleString('es-PE');
const mmss = s => { s = Math.floor(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const store = {
  get(k, d) { try { const v = localStorage.getItem('ktt_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ktt_' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- dibujo ---------- */
function R(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function rr(x, y, w, h, r, fill, stroke, lw = 2) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function T(s, x, y, o = {}) {
  const size = o.size || 12, font = o.font || F2;
  ctx.font = (o.weight || (font === F2 ? 700 : 400)) + ' ' + size + 'px ' + font;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'top';
  if (o.alpha !== undefined) ctx.globalAlpha = o.alpha;
  if (o.outline) { ctx.lineJoin = 'round'; ctx.strokeStyle = o.outline; ctx.lineWidth = o.ow || Math.max(3, size / 3); ctx.strokeText(s, x, y); }
  if (o.shadow) { ctx.fillStyle = o.shadow; ctx.fillText(s, x + (o.sd || 2), y + (o.sd || 2)); }
  ctx.fillStyle = o.color || COL.fg;
  ctx.fillText(s, x, y);
  ctx.globalAlpha = 1;
}
function tw(s, size, font = F2, weight) { ctx.font = (weight || (font === F2 ? 700 : 400)) + ' ' + size + 'px ' + font; return ctx.measureText(s).width; }
function wrap(s, maxW, size, font = F2) {
  const words = s.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (tw(t, size, font) > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
const HEART = ['.XX.XX.', 'XXXXXXX', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...'];
const heartCache = {};
function heartSprite(c, p) {
  const key = c + p; if (heartCache[key]) return heartCache[key];
  const cnv = document.createElement('canvas'); cnv.width = 7 * p; cnv.height = 6 * p;
  const g = cnv.getContext('2d');
  HEART.forEach((row, j) => [...row].forEach((ch, i) => { if (ch === 'X') { g.fillStyle = c; g.fillRect(i * p, j * p, p, p); } }));
  g.fillStyle = 'rgba(255,255,255,.75)'; g.fillRect(p, p, p, p);
  return (heartCache[key] = cnv);
}
function heart(x, y, p, c, a = 1) { ctx.globalAlpha = a; ctx.drawImage(heartSprite(c, p), Math.round(x - 3.5 * p), Math.round(y - 3 * p)); ctx.globalAlpha = 1; }
function eye(x, y, c = COL.fg) { // ícono de ojo pixelado 12x8
  R(x + 3, y, 6, 1, c); R(x + 1, y + 1, 10, 1, c); R(x, y + 2, 12, 4, c); R(x + 1, y + 6, 10, 1, c); R(x + 3, y + 7, 6, 1, c);
  R(x + 4, y + 2, 4, 4, COL.ink); R(x + 5, y + 3, 1, 1, c);
}
function person(x, y, c) { R(x + 4, y, 6, 6, c); R(x + 1, y + 7, 12, 6, c); }
function wifi(cx, cy, s, c, lvl = 3) { // ícono wifi con arcos
  ctx.strokeStyle = c; ctx.lineCap = 'butt'; ctx.lineWidth = s * 0.16;
  for (let i = 1; i <= 3; i++) { if (i > lvl) ctx.globalAlpha = .25; ctx.beginPath(); ctx.arc(cx, cy, s * 0.22 * i + s * .05, Math.PI * 1.22, Math.PI * 1.78); ctx.stroke(); ctx.globalAlpha = 1; }
  R(cx - s * .08, cy - s * .08, s * .16, s * .16, c);
}

/* ---------- recursos (arte de MNRY recortado de la hoja de sprites) ---------- */
const IMG = {};
const ASSETS = ['idle1','idle2','idle3','tap1','tap2','tap3','happy1','happy2','happy3a','happy3','excited1','excited2',
  'angry1','angry2','sad1','sad2','phone1','hat1','hat2','president1','panic1','gameover1',
  'ministro','congreso','periodista','manifestantes','asesor','policia','docs_pila','docs_caja','docs_urgente',
  'bg_despacho','bg_palacio','bg_protesta','bg_emergencia'];
let loaded = 0;
function loadAssets() {
  return Promise.all(ASSETS.map(n => new Promise(res => {
    const im = new Image(); im.onload = () => { IMG[n] = im; loaded++; res(); }; im.onerror = () => { loaded++; res(); };
    im.src = 'assets/' + n + '.png';
  })));
}
function spr(name, x, y, s, o = {}) { // dibuja anclado abajo-centro
  const im = IMG[name]; if (!im) return null;
  const w = im.width * s * (o.sx || 1), h = im.height * s * (o.sy || 1);
  ctx.save();
  if (o.alpha !== undefined) ctx.globalAlpha = o.alpha;
  if (o.rot) { ctx.translate(x, y - h / 2); ctx.rotate(o.rot); ctx.drawImage(im, -w / 2, -h / 2, w, h); }
  else if (o.flip) { ctx.translate(Math.round(x + w / 2), 0); ctx.scale(-1, 1); ctx.drawImage(im, 0, Math.round(y - h), w, h); }
  else ctx.drawImage(im, Math.round(x - w / 2), Math.round(y - h), Math.round(w), Math.round(h));
  ctx.restore();
  return [x - w / 2, y - h, w, h];
}

/* ---------- audio: síntesis chiptune con Web Audio ---------- */
const A = { ctx: null, on: store.get('sound', true), master: null, sfx: null, mus: null, noise: null, lastTap: 0 };
function unlockAudio() {
  if (!A.ctx) {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    A.ctx = new AC();
    A.master = A.ctx.createGain(); A.master.gain.value = A.on ? 1 : 0; A.master.connect(A.ctx.destination);
    A.sfx = A.ctx.createGain(); A.sfx.gain.value = .55; A.sfx.connect(A.master);
    A.mus = A.ctx.createGain(); A.mus.gain.value = .22; A.mus.connect(A.master);
    const len = A.ctx.sampleRate * 1.5, buf = A.ctx.createBuffer(1, len, A.ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    A.noise = buf;
  }
  if (A.ctx.state === 'suspended') A.ctx.resume();
}
function setSound(on) { A.on = on; store.set('sound', on); if (A.master) A.master.gain.setTargetAtTime(on ? 1 : 0, A.ctx.currentTime, .02); }
function tone(f, dur, o = {}) {
  if (!A.ctx || !A.on) return;
  const t = A.ctx.currentTime + (o.at || 0), osc = A.ctx.createOscillator(), g = A.ctx.createGain();
  osc.type = o.type || 'square'; osc.frequency.setValueAtTime(f, t);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
  const v = o.vol || .15; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
  osc.connect(g); g.connect(o.bus || A.sfx); osc.start(t); osc.stop(t + dur + .02);
}
function noise(dur, o = {}) {
  if (!A.ctx || !A.on) return;
  const t = A.ctx.currentTime + (o.at || 0), src = A.ctx.createBufferSource(), g = A.ctx.createGain(), f = A.ctx.createBiquadFilter();
  src.buffer = A.noise; f.type = o.ftype || 'bandpass'; f.frequency.setValueAtTime(o.f || 1200, t);
  if (o.fto) f.frequency.exponentialRampToValueAtTime(o.fto, t + dur);
  f.Q.value = o.q || 1; const v = o.vol || .2; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
  src.connect(f); f.connect(g); g.connect(o.bus || A.sfx); src.start(t, Math.random()); src.stop(t + dur + .02);
}
const SFX = {
  tap(m) { if (!A.ctx) return; const n = A.ctx.currentTime; if (n - A.lastTap < .045) return; A.lastTap = n; tone(520 + m * 90 + Math.random() * 40, .06, { vol: .09 }); },
  heart() { tone(880, .12, { to: 1760, type: 'triangle', vol: .08 }); },
  combo(l) { [0, 4, 7, 12].forEach((s, i) => tone(523 * Math.pow(2, (s + l * 2) / 12), .09, { at: i * .055, vol: .12 })); },
  knock() { [0, .14, .28].forEach(a => { tone(140, .09, { type: 'triangle', vol: .35, at: a, to: 70 }); noise(.05, { at: a, f: 400, vol: .2 }); }); },
  ring() { for (let i = 0; i < 6; i++) tone(i % 2 ? 1180 : 940, .05, { at: i * .055, vol: .09 }); },
  murmur() { noise(.9, { f: 500, q: .7, vol: .14 }); noise(.7, { f: 800, q: .9, vol: .08, at: .2 }); },
  mic() { tone(1500, .35, { type: 'sine', to: 2400, vol: .06 }); },
  alarm() { for (let i = 0; i < 4; i++) tone(i % 2 ? 784 : 523, .14, { at: i * .15, vol: .12, type: 'sawtooth' }); },
  beep() { tone(988, .08, { vol: .07 }); },
  glitch() { for (let i = 0; i < 5; i++) noise(.05, { at: i * .07, f: rand(300, 4000), q: 4, vol: .18 }); },
  whoosh() { noise(.35, { f: 3000, fto: 300, q: .8, vol: .25 }); },
  good() { tone(660, .08, { vol: .12 }); tone(990, .12, { at: .08, vol: .12 }); },
  bad() { tone(330, .14, { type: 'sawtooth', vol: .12 }); tone(220, .2, { at: .12, type: 'sawtooth', vol: .12 }); },
  paper() { noise(.12, { f: 2500, q: 1.5, vol: .12 }); },

const EVENTS = { minister: Minister, congress: Congress, protest: Protest, journalist: Journalist, documents: Documents, emergency: Emergency, internet: Internet, advisor: Advisor };
const SLOT = { minister: 'left', journalist: 'right', congress: 'modal', emergency: 'modal', advisor: 'modal', protest: 'bottom', documents: 'docs', internet: 'net' };

function spawnEvent() {
  const ph = CFG.phases[G.phase];
  const busy = new Set(G.events.map(e => SLOT[e.id]));
  let opts = ph.events.filter(id => !busy.has(SLOT[id]));
  if (G.netDown) opts = opts.filter(id => id !== 'protest' && id !== 'documents');
  if (opts.length > 1) { const f = opts.filter(id => id !== G.lastEv); if (f.length) opts = f; }

  if (gov && Math.random() < .5) G.hearts.push({ x: rand(110, 250), y: 400, vx: rand(-30, 30), vy: rand(-140, -80), p: 3, c: pick([COL.pink, COL.gold, COL.red]), t: 0, life: 1.4, ph: 0 });
  ctx.restore();

  T(gov ? 'SE CAYÓ' : 'SE ACABÓ', 180, 14, { size: 22, font: F1, align: 'center', color: COL.red, outline: '#000', ow: 6 });

  T(gov ? '¡PERO EL LIVE FUE UN ÉXITO!' : '¡Y TODAVÍA QUEDA TODO POR GOBERNAR!', 180, 74, { size: gov ? 9 : 7, font: F1, align: 'center', color: COL.gold });
  ctx.restore();
  // panel de resultados
  const pk = ease((t - .9) / .45), py = SB - 92 + (1 - pk) * 300;
  if (t > .9) {
    R(0, py, W, H - py, COL.ink); R(0, py, W, 2, COL.line);
    if (G.newRecord) { rr(96, py - 16, 168, 26, 6, COL.gold, COL.ink, 2); T('¡NUEVO RÉCORD!', 180, py - 8, { size: 9, font: F1, align: 'center', color: COL.ink }); }
    const rows = [['Likes conseguidos', full(G.likes), COL.pink], ['Máximo de espectadores', full(G.maxViewers), '#fff'], ['Tiempo de transmisión', mmss(G.t), '#fff'], ['Interrupciones ignoradas', String(G.ignored), COL.orange], ['Récord personal', full(REC.likes), COL.gold]];
    rows.forEach((r, i) => { const y = py + 14 + i * 23; T(r[0], 24, y, { size: 14, color: COL.muted, weight: 600 }); T(r[1], 336, y, { size: 15, align: 'right', color: r[2] }); if (i < 4) R(24, y + 19, 312, 1, '#ffffff14'); });
    const a = [20, py + 130, 320, 44], b = [20, py + 180, 200, 36], c = [228, py + 180, 112, 36];
    const d = [20, py + 224, 154, 34], e = [180, py + 224, 160, 34];
    if (t > 1.5) {
      btn(a, 'VOLVER A HACER LIVE', 'green', { size: 12 }); addUI(a, newGame);
      btn(b, 'COMPARTIR', 'pink', { size: 11 }); addUI(b, openShare);
      btn(c, 'INICIO', 'gray', { size: 10 }); addUI(c, () => { G = null; setScene('title'); });
      yapeBtn(d); addUI(d, openSupport);
      ghostBtn(e, '¿UN JUEGO PARA', 'TU MARCA? · MNRY', COL.cyan, 'star'); addUI(e, openMNRY);
      credit(py + 266, 9);
    }
  }
  ctx.restore();
}

/* ---------- compartir ---------- */
function shareUrl() { if (CFG.shareUrl) return CFG.shareUrl; try { const u = location.origin + location.pathname; return /^https?:/.test(u) && !/claude|anthropic|localhost|127\./.test(u) ? u : ''; } catch (e) { return ''; } }
function shareText() {
  const u = shareUrl(), gov = G.ending === 'gov';
  return 'Conseguí ' + full(G.likes) + ' likes en KEIKO TAP TAP y ' + (gov ? 'se cayó el gobierno 💥' : 'se acabó el live 📉') + ' en ' + mmss(G.t) + '. ¿Me superas?' + (u ? ' ' + u : '');
}
function buildCard() {
  const c = document.createElement('canvas'); c.width = 720; c.height = 1280; const g = c.getContext('2d'); g.setTransform(2, 0, 0, 2, 0, 0);
  withCtx(g, () => {
    const gov = G.ending === 'gov';
    R(0, 0, W, H, '#0b0f1a');
    if (bgCache) ctx.drawImage(bgCache, 0, 0, bgCache.width, bgCache.height, 0, 0, W, H);
    R(0, 0, W, ST + 4, '#0b0f1a');
    T('KEIKO TAP TAP', 180, 22, { size: 20, font: F1, align: 'center', color: COL.gold, outline: COL.ink, ow: 6, shadow: COL.red2, sd: 3 });
    T('¡NO ME INTERRUMPAN, ESTOY EN LIVE!', 180, 56, { size: 7, font: F1, align: 'center', color: '#fff' });
    ctx.save(); ctx.beginPath(); ctx.rect(0, ST, W, SB - ST); ctx.clip();
    spr(gov ? 'gameover1' : 'sad2', 180, SB + 14, 2.35);
    ctx.restore();
    rr(16, 120, 328, 64, 8, 'rgba(11,15,26,.85)', COL.red, 2);
    T(gov ? 'SE CAYÓ EL GOBIERNO' : 'SE ACABÓ EL LIVE', 180, 134, { size: 13, font: F1, align: 'center', color: COL.red });
    T(gov ? '¡PERO EL LIVE FUE UN ÉXITO!' : '¡Y QUEDA TODO POR GOBERNAR!', 180, 160, { size: 8, font: F1, align: 'center', color: COL.gold });
    R(0, SB, W, H - SB, '#0b0f1a'); R(0, SB, W, 2, COL.line);
    heart(52, SB + 46, 4, COL.pink);
    T(full(G.likes), 80, SB + 30, { size: 26, font: F1, color: '#fff' });
    T('LIKES', 82, SB + 64, { size: 8, font: F1, color: COL.pink });
    const rows = [['Máx. espectadores', full(G.maxViewers)], ['Tiempo en vivo', mmss(G.t)], ['Interrupciones ignoradas', String(G.ignored)]];
    rows.forEach((r, i) => { T(r[0], 24, SB + 92 + i * 22, { size: 14, color: COL.muted, weight: 600 }); T(r[1], 336, SB + 92 + i * 22, { size: 14, align: 'right', color: '#fff' }); });
    rr(24, H - 62, 312, 34, 8, COL.pink);
    T('¿ME SUPERAS?', 180, H - 51, { size: 11, font: F1, align: 'center', color: '#fff' });
    T('Desarrollado por MNRY · mantarraya.pe', 180, H - 20, { size: 9, align: 'center', color: COL.muted, weight: 400 });
  });
  return c;
}
const shareEl = document.getElementById('share');
let cardBlob = null;
function openShare() {
  const c = buildCard();
  document.getElementById('shImg').src = c.toDataURL('image/png');
  cardBlob = null; try { c.toBlob(b => { cardBlob = b; }, 'image/png'); } catch (e) {}
  const txt = shareText();
  document.getElementById('shTxt').value = txt;
  document.getElementById('shWa').href = 'https://wa.me/?text=' + encodeURIComponent(txt);

}
document.getElementById('supSave').onclick = saveQR;
document.getElementById('supQr').onclick = saveQR;
document.getElementById('supQr').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); saveQR(); } };
document.getElementById('supCl').onclick = () => { document.getElementById('support').hidden = true; };

document.getElementById('shCp').onclick = async () => {
  const ta = document.getElementById('shTxt'), b = document.getElementById('shCp');
  try { await navigator.clipboard.writeText(ta.value); b.textContent = 'Copiado'; } catch (e) { ta.focus(); ta.select(); b.textContent = 'Selecciónalo y copia'; }
  setTimeout(() => { b.textContent = 'Copiar texto'; }, 1800);
};
document.getElementById('shNat').onclick = async () => {
  const txt = document.getElementById('shTxt').value;
  try {
    const file = cardBlob ? new File([cardBlob], 'keiko-tap-tap.png', { type: 'image/png' }) : null;
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], text: txt });
    else await navigator.share({ text: txt });
  } catch (e) { /* el usuario canceló o el navegador no lo permite */ }
};

/* ---------- entrada ---------- */
const caps = new Map();
function pt(e) { const r = cv.getBoundingClientRect(); return { id: e.pointerId, x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
cv.addEventListener('pointerdown', e => {
  if (scene === 'over' && G) G.overTouched = true;
  e.preventDefault(); unlockAudio(); cv.focus({ preventScroll: true });
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  const p = pt(e);
  for (let i = ui.length - 1; i >= 0; i--) if (inR(p.x, p.y, ui[i].r)) { pressedUI = ui[i]; caps.set(p.id, { up: q => { if (pressedUI && inR(q.x, q.y, pressedUI.r)) { const f = pressedUI.fn; pressedUI = null; SFX.click(); f(); } pressedUI = null; } }); return; }
  if (scene !== 'play') return;
  const evs = [...G.events].sort((a, b) => b.z - a.z);
  for (const ev of evs) if (ev.hit(p.x, p.y)) { if (ev.down(p) !== false) { caps.set(p.id, ev); return; } }
  if (p.y >= ST && p.y <= SB) doTap(p.x, p.y);
}, { passive: false });
cv.addEventListener('pointermove', e => { const h = caps.get(e.pointerId); if (h && h.move) h.move(pt(e)); });
function endPointer(e) { const h = caps.get(e.pointerId); caps.delete(e.pointerId); if (h && h.up) h.up(pt(e)); unlockAudio(); }
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (scene === 'over' && G) G.overTouched = true;
  if (e.key === 'Escape') { if (scene === 'play') pauseGame(); else if (scene === 'pause') resumeGame(); else if (!shareEl.hidden) shareEl.hidden = true; }
  if ((e.key === ' ' || e.key === 'Enter') && !e.repeat && shareEl.hidden) {
    e.preventDefault(); unlockAudio();
    if (scene === 'play') doTap(180 + rand(-40, 40), 330 + rand(-30, 30));
    else if (scene === 'title') newGame();
    else if (scene === 'pause') resumeGame();
    else if (scene === 'over' && G.overT > 1.5) newGame();
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

/* ---------- bucle ---------- */
function resize() {
  const wrapEl = document.getElementById('wrap'), cs = getComputedStyle(wrapEl);
  const aw = wrapEl.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = wrapEl.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const s = Math.max(.3, Math.min(aw / W, ah / H));
  cv.style.width = Math.floor(W * s) + 'px'; cv.style.height = Math.floor(H * s) + 'px';
  K = Math.max(1, Math.min(3, Math.ceil(s * (window.devicePixelRatio || 1))));
  cv.width = W * K; cv.height = H * K; ctx.setTransform(K, 0, 0, K, 0, 0); ctx.imageSmoothingEnabled = false;
  if (loaded >= ASSETS.length) buildCaches();
}
window.addEventListener('resize', resize);
const creditEl = document.getElementById('credit');
function placeCredit() {
  const show = creditRect && (scene === 'title' || scene === 'pause' || (scene === 'over' && G && G.overT > 1.5)) && shareEl.hidden && document.getElementById('support').hidden;
  if (!show) { if (!creditEl.hidden) creditEl.hidden = true; creditRect = null; return; }
  const r = cv.getBoundingClientRect(), k = r.width / W;
  Object.assign(creditEl.style, { left: r.left + creditRect[0] * k + 'px', top: r.top + creditRect[1] * k + 'px', width: creditRect[2] * k + 'px', height: creditRect[3] * k + 'px' });
  creditEl.hidden = false; creditRect = null;
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt);
  ctx.setTransform(K, 0, 0, K, 0, 0); ctx.imageSmoothingEnabled = false;
  if (scene === 'title' || scene === 'loading') drawTitle();
  else if (scene === 'play') drawPlay();
  else if (scene === 'pause') drawPause();
  else if (scene === 'over') drawOver();
  placeCredit();
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
const fontsReady = (document.fonts && document.fonts.load) ? Promise.race([Promise.all([document.fonts.load('16px "Press Start 2P"'), document.fonts.load('700 16px "Pixelify Sans"'), document.fonts.load('400 16px "Pixelify Sans"'), document.fonts.load('600 16px "Pixelify Sans"')]), new Promise(r => setTimeout(r, 2500))]) : Promise.resolve();
Promise.all([loadAssets(), fontsReady]).then(() => { buildCaches(); setScene('title'); });
window.__ktt = { get G() { return G; }, get scene() { return scene; }, newGame, CFG, spawn: id => G && G.events.push(new EVENTS[id]()), end: endGame };
